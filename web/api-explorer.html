<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Election Signal · Phase 0 API Explorer</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:14px/1.5 system-ui,'Segoe UI',sans-serif;background:#080e19;color:#eff5ff;margin:0;padding:24px}main{max-width:1100px;margin:auto}a{color:#84b2ff}h1{font-size:28px}p{color:#a4b4d0}button,select{background:#182842;border:1px solid #345174;color:#eff5ff;padding:11px 13px;border-radius:10px;cursor:pointer}button:hover{border-color:#8db5e9}select{min-width:160px}.grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:18px}.card{background:#101c2d;border:1px solid #2c3e57;padding:18px;border-radius:16px}pre{white-space:pre-wrap;word-break:break-word;margin:0;padding:15px;background:#081320;border-radius:10px;overflow:auto;max-height:68vh}.buttons{display:grid;gap:8px}button{text-align:left}.tag{font-size:12px;border-radius:8px;background:#46311e;color:#edc281;padding:6px 9px}label{display:block;color:#91a7c6;margin:12px 0 5px}@media(max-width:770px){.grid{grid-template-columns:1fr}}
</style></head><body><main><p><a href="/">← Election Signal dashboard</a></p><h1>Phase 0 API Explorer <span class="tag">DEMO ONLY</span></h1><p>These are real local endpoints returning explicitly fictional fixture data or honest unavailable states. They do not connect to election providers.</p><div class="grid"><section class="card"><label for="state">State</label><select id="state"><option>TX</option><option>CA</option><option>GA</option><option>MI</option><option>ME</option><option>DC</option></select><label for="office">Office</label><select id="office"><option value="all">All</option><option value="house">House</option><option value="senate">Senate</option><option value="governor">Governor</option></select><h2 style="font-size:17px">Explore endpoints</h2><div class="buttons" id="paths"></div></section><section class="card"><p id="endpoint">Select an endpoint</p><pre id="output">Choose an API above to inspect its response.</pre></section></div></main>
<script>
const paths=[['Server health',()=>'/api/v1/health'],['Metadata',()=>'/api/v1/meta'],['Source registry',()=>'/api/v1/sources/health'],['Selected global context',()=>`/api/v1/context?mode=live&office=${office.value}&state=${state.value}`],['Demo race list',()=>`/api/v1/demo/races?office=${office.value}&state=${state.value}`],['State summary',()=>`/api/v1/demo/states/${state.value}/summary`],['Reference geography manifest',()=>'/api/v1/geography/manifest'],['Selected county shapes',()=>`/api/v1/geography/states/${state.value}/counties`],['Historical results 2022',()=>'/api/v1/history/results?year=2022'],['Published polls',()=>'/api/v1/polls'],['Exit polls',()=>'/api/v1/exit-polls'],['Model status',()=>'/api/v1/models/races/TX-SEN-2026-DEMO']];
const state=document.querySelector('#state'),office=document.querySelector('#office'),box=document.querySelector('#paths');
paths.forEach(([label,getPath])=>{const b=document.createElement('button');b.textContent=label;b.addEventListener('click',async()=>{const path=getPath();document.querySelector('#endpoint').textContent=path;document.querySelector('#output').textContent='Loading...';try{const res=await fetch(path);const json=await res.json();const str=JSON.stringify(json,null,2);document.querySelector('#output').textContent=str.length>20000?str.slice(0,20000)+'\n...response truncated in browser preview':str;}catch(e){document.querySelector('#output').textContent=String(e)}});box.appendChild(b)});
</script></body></html>
