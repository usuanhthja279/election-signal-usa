name: Phase 2 quality

on:
  push:
    branches: [main, "feature/**", "feature-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    name: Spring Boot quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: .\mvnw.cmd -B verify
        shell: pwsh
        working-directory: backend

  postgres-integration:
    name: Native PostgreSQL integration and Flyway
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install native PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-17 postgresql-client-17
          sudo systemctl start postgresql
      - name: Create ephemeral database and run migration/API tests twice
        shell: bash
        run: |
          set -euo pipefail
          db_user="election_ci_${GITHUB_RUN_ID}"
          db_name="election_ci_${GITHUB_RUN_ID}"
          db_password="$(openssl rand -hex 24)"
          echo "::add-mask::$db_password"
          sudo -u postgres psql --set=ON_ERROR_STOP=1 -c "CREATE ROLE ${db_user} LOGIN PASSWORD '${db_password}'"
          sudo -u postgres createdb --owner="$db_user" "$db_name"
          export ELECTION_DB_TEST_URL="jdbc:postgresql://127.0.0.1:5432/${db_name}"
          export ELECTION_DB_TEST_USER="$db_user"
          export ELECTION_DB_TEST_PASSWORD="$db_password"
          cd backend
          ./mvnw -B verify
          ./mvnw -B test

  playwright:
    name: Playwright desktop, tablet and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start demo API and preview
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && ./mvnw -q spring-boot:run -Dspring-boot.run.profiles=demo > ../backend-ci.log 2>&1) &
          echo $! > "$RUNNER_TEMP/backend.pid"
          (cd frontend && npm run dev > ../frontend-ci.log 2>&1) &
          echo $! > "$RUNNER_TEMP/frontend.pid"
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat backend-ci.log frontend-ci.log
          exit 1
      - name: Run browser regression
        run: npm run test:e2e
        working-directory: frontend
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase2-playwright-failure-${{ github.run_id }}
          path: |
            frontend/test-results/
            backend-ci.log
            frontend-ci.log
          if-no-files-found: ignore
          retention-days: 7

  windows-smoke:
    name: Windows native launcher and PowerShell smoke
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
        working-directory: frontend
      - name: Parse PowerShell scripts and start/stop owned demo processes
        shell: pwsh
        run: |
          .\scripts\Test-Phase2Windows.ps1
          .\Start-Phase1.ps1 -Profile demo -NoBrowser
          try {
            if ((Invoke-RestMethod http://127.0.0.1:8080/api/v1/health).dataMode -ne 'DEMO') { throw 'Demo API did not start in demo mode.' }
            if ((Invoke-WebRequest http://127.0.0.1:3000/ -UseBasicParsing).StatusCode -ne 200) { throw 'Frontend did not start.' }
          } finally {
            .\Stop-Phase1.ps1
          }
